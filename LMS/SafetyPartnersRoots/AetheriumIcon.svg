<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Vnější hexagon = struktura/prvek (odkaz na "Core" a chemicko-technický charakter) -->
  <polygon points="50,15 80.31,32.5 80.31,67.5 50,85 19.69,67.5 19.69,32.5"/>
  <!-- Vnitřní kruh = jádro/nucleus -->
  <circle cx="50" cy="50" r="12"/>
  <!-- Šest paprsků spojujících jádro se šesti vrcholy hexagonu = "energie"/propojení -->
  <line x1="50" y1="38" x2="50" y2="15"/>
  <line x1="60.39" y1="44" x2="80.31" y2="32.5"/>
  <line x1="60.39" y1="56" x2="80.31" y2="67.5"/>
  <line x1="50" y1="62" x2="50" y2="85"/>
  <line x1="39.61" y1="56" x2="19.69" y2="67.5"/>
  <line x1="39.61" y1="44" x2="19.69" y2="32.5"/>
</svg>
